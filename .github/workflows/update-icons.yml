name: Auto Fetch Icons

on:
  push:
    paths:
      - 'Data/live/FF_ItemsData.json'
      - 'Data/live/CollectionBanner.json'
      - 'Data/live/IconCDNMap.json'
      - 'Data/advance/FFAdv_ItemsData.json'
      - 'Data/advance/CollectionBanner.json'
  workflow_dispatch:

jobs:
  update-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run fetch script
        run: node fetch-icons.js
        env:
          ROUTE_1: ${{ secrets.ROUTE_1 }}
          ROUTE_2: ${{ secrets.ROUTE_2 }}
          ROUTE_3: ${{ secrets.ROUTE_3 }}
          ROUTE_4: ${{ secrets.ROUTE_4 }}

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-fetched new icons"
          file_pattern: 'ff-icons/'
